name: Publication pipeline
on: [push, pull_request]
jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: code/requirements.txt
      - run: python -m pip install -r code/requirements.txt
      - run: python -B -m unittest discover -s tests -v
      - run: python -B code/reproduce_paper.py --verify-only
      - run: python -B code/reproduce_paper.py --from-data
      - run: python -B code/reproduce_paper.py --smoke
